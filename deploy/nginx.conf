# nginx server block for homestaffservices.com (Next.js on 127.0.0.1:3107)
# Installed to /etc/nginx/sites-available/homestaffservices.com by deploy/setup.sh.
# certbot adds the HTTPS (443) block and the http->https redirect.
limit_req_zone $binary_remote_addr zone=homestaff_forms:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name homestaffservices.com www.homestaffservices.com;

    client_max_body_size 6m;

    location ~ /\.(?!well-known) { deny all; }

    location ~ ^/api/(enquiries|admin/login)$ {
        limit_req zone=homestaff_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:3107;
        include /etc/nginx/snippets/homestaff-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3107;
        include /etc/nginx/snippets/homestaff-proxy.conf;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
